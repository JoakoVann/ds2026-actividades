services:
  api:
    build:
      context: ./back
    ports:
      - "3000:3000"
    env_file:
      - ./back/.env
    volumes:
      - ./back:/app

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    env_file:
      - ./back/.env
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: